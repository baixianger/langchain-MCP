name: Deploy to VPS

on:
  push:
    branches: [production]
    paths:
      - 'packages/api/**'
      - 'packages/mcp-server/**'
      - 'config/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KOFI_VERIFICATION_TOKEN: ${{ secrets.KOFI_VERIFICATION_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,KOFI_VERIFICATION_TOKEN,OPENROUTER_API_KEY
          script: |
            cd /opt/langchain-mcp
            git pull origin production
            echo "PORT=3000" > .env
            echo "NODE_ENV=production" >> .env
            echo "API_BASE_URL=https://api.langchain-mcp.xyz" >> .env
            echo "DB_PATH=/opt/langchain-mcp/data/users.db" >> .env
            echo "CHROMA_PATH=http://localhost:8000" >> .env
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> .env
            echo "KOFI_VERIFICATION_TOKEN=${KOFI_VERIFICATION_TOKEN}" >> .env
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" >> .env
            echo "EMBEDDING_MODEL=qwen/qwen3-embedding-8b" >> .env
            cd packages/api
            npm install --production
            npm run build
            pm2 restart langchain-mcp-api
