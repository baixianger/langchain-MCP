name: Deploy to VPS

on:
  push:
    branches: [production]
    paths:
      - 'packages/api/**'
      - 'packages/mcp-server/**'
      - 'config/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KOFI_VERIFICATION_TOKEN: ${{ secrets.KOFI_VERIFICATION_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,KOFI_VERIFICATION_TOKEN,OPENROUTER_API_KEY
          script: |
            cd /opt/langchain-mcp
            git pull origin production

            # Update .env with secrets
            cat > .env << EOF
            PORT=3000
            NODE_ENV=production
            API_BASE_URL=https://api.langchain-mcp.xyz
            DB_PATH=/opt/langchain-mcp/data/users.db
            CHROMA_PATH=http://localhost:8000
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            KOFI_VERIFICATION_TOKEN=${KOFI_VERIFICATION_TOKEN}
            OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
            EMBEDDING_MODEL=qwen/qwen3-embedding-8b
            EOF

            cd packages/api
            npm install --production
            npm run build
            pm2 restart langchain-mcp-api
