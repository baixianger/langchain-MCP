name: Deploy to VPS

on:
  push:
    branches: [production]
    paths:
      - 'packages/api/**'
      - 'packages/mcp-server/**'
      - 'config/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Host langchain-mcp" >> ~/.ssh/config
          echo "  HostName $VPS_HOST" >> ~/.ssh/config
          echo "  User root" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_ed25519" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync to VPS
        env:
          PORT: ${{ vars.PORT }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DB_PATH: ${{ vars.DB_PATH }}
          CHROMA_PATH: ${{ vars.CHROMA_PATH }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KOFI_VERIFICATION_TOKEN: ${{ secrets.KOFI_VERIFICATION_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Sync code to VPS (excluding data, node_modules, etc.)
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'data' \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '*.log' \
            packages/api/ langchain-mcp:/opt/langchain-mcp/api/

          # Update .env on VPS
          ssh langchain-mcp "cat > /opt/langchain-mcp/.env << EOF
          PORT=${PORT}
          NODE_ENV=${NODE_ENV}
          API_BASE_URL=${API_BASE_URL}
          DB_PATH=${DB_PATH}
          CHROMA_PATH=${CHROMA_PATH}
          EMBEDDING_MODEL=${EMBEDDING_MODEL}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          KOFI_VERIFICATION_TOKEN=${KOFI_VERIFICATION_TOKEN}
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          EOF"

          # Build and restart on VPS
          ssh langchain-mcp "cd /opt/langchain-mcp/api && npm install --production && npm run build && pm2 restart langchain-mcp-api"
