name: Deploy to VPS

on:
  push:
    branches: [production]
    paths:
      - 'packages/api/**'
      - 'packages/mcp-server/**'
      - 'config/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/langchain-mcp
            git pull origin main
            cd packages/api
            npm install --production
            npm run build
            pm2 restart langchain-mcp-api
