[project]
name = "ingest"
version = "0.1.0"
description = "Ingest documents into ChromaDB"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openrouter = ["httpx>=0.27.0"]

[project.scripts]
ingest = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
